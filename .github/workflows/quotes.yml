name: quotes

# The board refreshes itself by chaining: each run works for a few hours, then
# asks GitHub to start the next one. See scripts/run_cycle.sh for why the cron
# below is a fallback rather than the mechanism.
on:
  schedule:
    # Kept only as a free restart if GitHub's scheduler ever becomes reliable.
    # It has not been. Do not depend on it.
    - cron: '7,27,47 13-21 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-quotes]

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Refresh on a loop, then hand off
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          CHAIN_TOKEN: ${{ secrets.CHAIN_TOKEN }}
        run: bash scripts/run_cycle.sh
