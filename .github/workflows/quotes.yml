name: quotes

# Weekdays only, roughly 8am to 4pm Central across both CST and CDT.
# Every 20 minutes. Eighteen symbols per run, one credit each, lands near
# 490 of the 800 daily credits on the Twelve Data Basic plan. Nothing runs
# overnight or at weekends, which is what keeps it inside the free tier.
on:
  schedule:
    # Odd minutes on purpose. GitHub queues every repo's :00, :15, :30 and
    # :45 jobs at once, and scheduled runs get dropped or badly delayed in
    # that crush. 7/27/47 is still every twenty minutes, just off the peak.
    - cron: '7,27,47 13-21 * * 1-5'
  workflow_dispatch:
  # Out-of-band trigger. GitHub's own scheduler is unreliable, so anything
  # holding a token with Contents write can POST to /dispatches and force a
  # refresh without needing the Actions permission.
  repository_dispatch:
    types: [refresh-quotes]

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch quotes
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: python3 scripts/fetch_quotes.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stage first: on the very first run quotes.json is untracked, and
          # git diff does not see untracked files.
          git add quotes.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "quotes: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
