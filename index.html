<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The Else Effect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Open+Sans:wght@400;600;700&display=swap">

<style>
/* ============================================================
   THE ELSE EFFECT - Murrah Hall signage player
   Else School of Management, Millsaps College
   Single committed visual world (a signage screen has one look),
   so every colour is painted explicitly rather than inherited.
   ============================================================ */

/* PALETTE - written out longhand on purpose.
   These were CSS custom properties until 26 August 2026, when the screen was
   tried on a Samsung hallway TV using its own built-in browser. That browser
   does not support var(), so every colour and both stage dimensions resolved
   to nothing: white background, black text, a stage with no width, and the
   whole layout collapsed into a narrow column.
   The values are constants and nothing reassigns them at runtime, so they are
   inlined everywhere instead. Do not reintroduce var() in this file.

     field    #1B1046   deep purple ground
     purple   #21145F   Millsaps Purple, PMS 273
     lift     #2C1C78   raised plane
     white    #FFFFFF
     lav      #C7BFE6   lavender-biased secondary ink
     lav-dim  #8E82BC
     pink     #E84B8A   promotional accent, used sparingly
     stage    1920 x 1080
*/

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1B1046;}
body.editing #viewport{right:520px;}
body{
  font-family:"Open Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  color:#FFFFFF;
  -webkit-font-smoothing:antialiased;
}

/* ---------- viewport + fixed design stage ---------- */
#viewport{
  position:fixed;top:0;left:0;right:0;bottom:0;
  transition:right .25s ease;
  background:#1B1046;
  overflow:hidden;
}
#stage{
  position:absolute;top:0;left:0;
  width:1920px;height:1080px;
  transform-origin:0 0;
  background:#1B1046;
  transition:transform 1.2s linear;
}
/* faint field gradient so a flat purple wall of light gets depth */
#stage:before{
  content:"";position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(120% 90% at 18% 12%, #2A1A6B 0%, #1B1046 58%, #150C39 100%);
  z-index:0;
}

/* ---------- persistent chrome ---------- */
.chrome{position:absolute;z-index:40;}
#markEsom{top:62px;left:96px;width:300px;opacity:.92;}
#markEsom img{width:100%;display:block;}

#clock{
  top:66px;right:96px;text-align:right;
  font-size:22px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:#C7BFE6;line-height:1.5;
}
#clock .t{color:#FFFFFF;font-size:30px;letter-spacing:.06em;font-variant-numeric:tabular-nums;}

#bar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:rgba(199,191,230,.16);z-index:45;}
#barFill{height:100%;width:0;background:#E84B8A;}

#shield{
  position:absolute;z-index:1;
  right:-330px;bottom:-300px;width:1240px;
  opacity:.042;pointer-events:none;
}
#shield img{width:100%;display:block;}

/* ---------- slides ---------- */
.slide{
  position:absolute;top:0;left:0;
  width:1920px;height:1080px;
  padding:150px 150px 130px 150px;
  z-index:10;overflow:hidden;
  opacity:0;visibility:hidden;
  transition:opacity .62s ease;
  display:flex;flex-direction:column;justify-content:center;
}
.slideIn{width:100%;transform-origin:0 50%;}   /* shrink toward the left margin,
   not the centre, so a scaled slide keeps the same left edge as an unscaled one */
.slide[data-local-on="1"]{opacity:1;visibility:visible;z-index:20;}

/* staggered entrance on the active slide */
.slide .rise{transform:translateY(26px);opacity:0;transition:transform .72s cubic-bezier(.2,.7,.25,1),opacity .72s ease;}
.slide[data-local-on="1"] .rise{transform:translateY(0);opacity:1;}
.slide[data-local-on="1"] .d1{transition-delay:.10s;}
.slide[data-local-on="1"] .d2{transition-delay:.20s;}
.slide[data-local-on="1"] .d3{transition-delay:.32s;}
.slide[data-local-on="1"] .d4{transition-delay:.44s;}

/* ---------- shared type ---------- */
.eyebrow{
  font-size:27px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  color:#E84B8A;margin:0 0 34px 0;display:flex;align-items:center;
}
.eyebrow span.rule{display:inline-block;width:96px;height:2px;background:#E84B8A;margin-right:28px;}

.head{
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;
  font-weight:600;font-size:112px;line-height:1.02;letter-spacing:-.005em;
  color:#FFFFFF;margin:0;max-width:1420px;text-wrap:balance;
}
.head.sm{font-size:88px;}
.agendaSlide .head{font-size:64px;}
.agendaSlide .eyebrow{margin-bottom:24px;}
.agendaSlide .meta{margin-top:34px;}
.body{
  font-size:38px;line-height:1.48;color:#C7BFE6;
  margin:38px 0 0 0;max-width:1180px;font-weight:400;
}
.meta{
  font-size:23px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;
  color:#8E82BC;margin:52px 0 0 0;
}

/* ---------- format: stat ---------- */
.statWrap{display:flex;align-items:flex-end;}
.statNum{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
  font-size:300px;line-height:.86;color:#FFFFFF;
  letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;
}
.statUnit{
  font-family:"Cormorant Garamond",Georgia,serif;font-size:132px;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;
  color:#E84B8A;line-height:1;margin-left:6px;
}
.statRule{width:300px;height:3px;background:#E84B8A;margin:52px 0 0 0;}
.statLabel{
  font-size:44px;line-height:1.35;color:#FFFFFF;font-weight:600;
  margin:36px 0 0 0;max-width:1320px;
}
.statSrc{font-size:21px;letter-spacing:.16em;text-transform:uppercase;color:#8E82BC;margin:34px 0 0 0;}

/* ---------- format: wall (employers / cities) ---------- */
.wall{
  display:flex;flex-wrap:wrap;margin:44px 0 0 -18px;max-width:1560px;
}
.wall b{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-weight:500;font-size:60px;line-height:1.28;color:#FFFFFF;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;
  margin:0 0 0 18px;white-space:nowrap;
}
.wallTag{margin:22px 0 0 0;color:#E4DEF7;}   /* optional tagline under a name-wall headline */
.wallTag + .wall{margin-top:30px;}
.wall i{
  font-style:normal;color:#E84B8A;font-size:26px;margin:0 0 0 18px;
  line-height:2.1;opacity:.55;
}

/* ---------- format: agenda (what is on at the college) ---------- */
.agenda{margin:26px 0 0 0;max-width:1500px;}
.agRow{display:flex;align-items:baseline;padding:13px 0;border-top:1px solid rgba(199,191,230,.17);}
.agRow:last-child{border-bottom:1px solid rgba(199,191,230,.17);}
.agWhen{
  flex:0 0 230px;font-size:25px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:#E84B8A;
  font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;
}
.agWhat{flex:1 1 auto;}
.agWhat b{
  display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;
  font-size:42px;line-height:1.14;color:#FFFFFF;
  font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;
}
.agWhat span{display:block;font-size:21px;line-height:1.35;color:#8E82BC;margin-top:3px;}
/* "board" variant of the agenda card: a betting board or scoreboard.
   Numbers in the first column are the point, so they go big and white;
   rows get heavier and the small print brightens for reading across a hall. */
.board .agWhen{flex:0 0 260px;font-size:62px;letter-spacing:.02em;color:#FFFFFF;line-height:1;
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;text-transform:none;}
.board .agWhat b{font-weight:700;font-size:46px;}
.board .agWhat span{font-size:25px;color:#C7BFE6;font-weight:600;}
.board .agRow{align-items:center;padding:12px 0;border-top:1px solid rgba(199,191,230,.32);}
.board .agRow:last-child{border-bottom:1px solid rgba(199,191,230,.32);}
.board .head.sm{font-weight:700;}

/* ---------- format: voices ---------- */
.quote{
  font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;
  font-weight:400;font-size:96px;line-height:1.18;color:#FFFFFF;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;
  margin:0;max-width:1500px;text-wrap:balance;
}
.attrib{margin:56px 0 0 0;display:flex;align-items:center;}
.attrib .dash{width:66px;height:2px;background:#E84B8A;margin-right:26px;}
.attrib .who{font-size:32px;font-weight:600;color:#FFFFFF;}
.attrib .role{font-size:32px;font-weight:400;color:#C7BFE6;}

/* ---------- format: ident ---------- */
.ident{align-items:center;text-align:center;justify-content:center;}
.ident .idShield{width:184px;margin:0 auto 56px auto;opacity:.95;}
.ident .idShield img{width:100%;display:block;}
.identTitle{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;
  font-size:150px;line-height:1;letter-spacing:.03em;color:#FFFFFF;margin:0;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;
}
.identRule{width:230px;height:2px;background:#E84B8A;margin:46px auto;}
.identSub{
  font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;
  font-size:60px;color:#C7BFE6;margin:0;
}

/* ---------- format: welcome (event mode) ---------- */
.welcome{background:#21145F;}
.welcome:before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(160deg,#2C1C78 0%,#21145F 62%,#180E48 100%);z-index:-1;}
.welcome .head{font-size:126px;}
.welcome .wLogo{margin:0 0 34px 0;}
.welcome .wLogo img{height:200px;width:auto;display:block;}

/* ---------- QR block ---------- */
.qr{position:absolute;right:150px;bottom:132px;z-index:25;display:flex;align-items:flex-end;}
.qr .qrTxt{text-align:right;margin-right:26px;width:540px;}
.qr .qrTxt b{display:block;font-size:23px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#E84B8A;margin-bottom:9px;}
.qr .qrTxt span{display:block;font-size:22px;line-height:1.45;color:#C7BFE6;}
/* a slide carrying the QR gives up the right third of its measure */
.has-qr .statLabel,.has-qr .body{max-width:900px;}
.has-qr .head{max-width:1120px;}
.has-qr .wall{max-width:1080px;}
.qr img{width:168px;height:168px;display:block;background:#fff;padding:11px;border-radius:3px;}
/* the ticker band raised the slide's bottom padding to 272px; keep the QR above it */
body.tickerOn .qr{bottom:272px;}
.qrMulti{flex-direction:column;align-items:flex-end;}
.qrMulti .qrTxt{width:auto;max-width:520px;margin:0 0 20px 0;}
.qrRow{display:flex;}
.qrTile{margin:0 0 0 22px;text-align:center;}
.qrTile img{width:196px;height:196px;}
.qrTile figcaption{margin-top:12px;font-size:19px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#C7BFE6;}
.has-qr .agenda{max-width:1060px;}

/* ---------- offline / holding card ---------- */
#holding{
  position:absolute;z-index:60;top:0;left:0;width:1920px;height:1080px;
  background:#1B1046;display:none;align-items:center;justify-content:center;
  flex-direction:column;text-align:center;
}
#holding.on{display:flex;}

/* ============================================================
   EDITOR  -  lives outside the scaled stage, laptop-sized.
   Never shown on the wall; opened with the E key or #edit.
   ============================================================ */
#editor{
  position:fixed;top:0;right:0;bottom:0;width:520px;z-index:200;
  background:#120A31;border-left:1px solid #34266F;
  display:none;flex-direction:column;
  font-size:14px;color:#E7E3F5;
}
#editor.on{display:flex;}
#edHead{padding:18px 20px 14px 20px;border-bottom:1px solid #34266F;flex:0 0 auto;}
#edHead h2{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:700;letter-spacing:.02em;color:#fff;}
#edHead p{margin:6px 0 0 0;font-size:12.5px;line-height:1.5;color:#9C8FCB;}
#edBody{flex:1 1 auto;overflow-y:auto;padding:16px 20px 28px 20px;}
#edFoot{flex:0 0 auto;padding:14px 20px;border-top:1px solid #34266F;background:#0E0727;display:flex;flex-wrap:wrap;}

.edSec{margin:0 0 22px 0;}
.edSec>h3{
  margin:0 0 10px 0;font-size:11px;font-weight:700;letter-spacing:.19em;
  text-transform:uppercase;color:#E84B8A;
}
.edRow{display:flex;align-items:center;margin:0 0 8px 0;}
.edRow label{flex:0 0 128px;font-size:12px;color:#9C8FCB;}
.edField{margin:0 0 12px 0;}
.edField label{display:block;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#9C8FCB;margin:0 0 5px 0;}
#editor input[type=text],#editor input[type=number],#editor textarea,#editor select{
  width:100%;background:#1B1046;border:1px solid #3B2C7D;color:#fff;
  font-family:inherit;font-size:14px;padding:8px 10px;border-radius:4px;
}
#editor textarea{min-height:74px;resize:vertical;line-height:1.5;}
#editor input:focus,#editor textarea:focus,#editor select:focus{outline:2px solid #E84B8A;outline-offset:1px;border-color:#E84B8A;}
#editor input[type=number]{width:88px;}
#editor input[type=checkbox]{width:16px;height:16px;accent-color:#E84B8A;}

.btn{
  font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  background:#2C1C78;color:#fff;border:1px solid #4A38A6;border-radius:4px;
  padding:9px 14px;margin:0 8px 8px 0;cursor:pointer;
}
.btn:hover{background:#3A2699;}
.btn:focus-visible{outline:2px solid #E84B8A;outline-offset:2px;}
.btn.pri{background:#E84B8A;border-color:#E84B8A;color:#fff;}
.btn.pri:hover{background:#F0619B;}
.btn.sm{padding:5px 9px;font-size:11px;margin:0 5px 0 0;letter-spacing:.06em;}
.btn.gh{background:transparent;border-color:#4A38A6;color:#B6A9E4;}
.btn[disabled]{opacity:.4;cursor:default;}

.sl{
  border:1px solid #34266F;border-radius:5px;padding:9px 11px;margin:0 0 7px 0;
  background:#170E3D;cursor:pointer;
}
.sl:hover{border-color:#4A38A6;}
.sl.sel{border-color:#E84B8A;background:#241557;}
.sl.dr{opacity:.62;border-style:dashed;}
.sl .slTop{display:flex;align-items:center;margin:0 0 3px 0;}
.sl .fmt{
  font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:#0E0727;background:#C7BFE6;border-radius:3px;padding:2px 6px;margin-right:8px;
}
.sl.dr .fmt{background:#6D5FA8;color:#fff;}
.sl .num{font-size:11px;color:#7A6CAF;margin-left:auto;font-variant-numeric:tabular-nums;}
.sl .ttl{font-size:13px;line-height:1.35;color:#fff;}
.slActions{display:flex;margin:8px 0 0 0;}

#edMsg{font-size:12px;line-height:1.5;color:#9C8FCB;flex:1 1 100%;margin:4px 0 0 0;min-height:18px;}
#edMsg.ok{color:#8BE0B4;}
#edMsg.err{color:#FF9BBE;}
#jsonOut{width:100%;height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;}

/* The way in. Fades up whenever a mouse moves and fades away again a few
   seconds later, so it is obvious on a laptop and never appears on a wall
   where nothing is moving a pointer. */
#editBtn{
  position:fixed;left:26px;bottom:26px;z-index:150;
  display:flex;align-items:center;
  background:rgba(18,10,49,.92);border:1px solid #4A38A6;border-radius:30px;
  padding:11px 20px 11px 16px;cursor:pointer;
  font-family:"Open Sans",Helvetica,Arial,sans-serif;
  font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:#fff;
  opacity:0;pointer-events:none;transition:opacity .35s ease;
}
#editBtn.show{opacity:1;pointer-events:auto;}
#editBtn:hover{background:#2C1C78;border-color:#E84B8A;}
#editBtn:focus-visible{outline:2px solid #E84B8A;outline-offset:3px;opacity:1;pointer-events:auto;}
#editBtn .pen{
  width:9px;height:9px;border-radius:50%;background:#E84B8A;
  margin-right:11px;flex:0 0 auto;
}
body.editing #editBtn{display:none;}

/* keyboard hint, only while the editor is open */
#hint{
  position:fixed;left:16px;bottom:16px;z-index:200;display:none;
  background:rgba(18,10,49,.94);border:1px solid #34266F;border-radius:5px;
  padding:10px 14px;font-size:11.5px;line-height:1.7;color:#9C8FCB;
}
#hint.on{display:block;}
#hint b{color:#fff;font-weight:700;}

@media (prefers-reduced-motion:reduce){
  .slide,.slide .rise,#stage{transition:none;}
  .slide .rise{transform:none;}
}

/* ---------- image card ---------- */
/* "fmt":"image" shows one finished graphic (a flyer, a poster) whole,
   centred between the logo and clock and clear of the market band.
   Added 27 October 2026 for the Fed Watch Party flyer. */
.slide.imgSlide{padding:0;}
.imgCard{position:absolute;left:150px;right:150px;top:36px;bottom:60px;
  display:flex;align-items:center;justify-content:center;}
body.tickerOn .imgCard{bottom:250px;}
.imgCard img{display:block;max-width:100%;max-height:100%;border-radius:6px;
  box-shadow:0 18px 60px rgba(0,0,0,.45);}
/* ---------- market band ---------- */
/* A quiet board, not a chyron. Nothing slides; the four tiles change
   together every fifteen seconds. Colour is the second signal behind the
   arrow, so the band still reads correctly to a colour-blind viewer and
   in the monochrome case. Lives inside #stage, so pixel shift moves it
   with everything else and no static edge burns into the panel. */
#tick{
  left:0;right:0;bottom:5px;height:220px;z-index:42;
  background:rgba(19,11,52,.94);
  border-top:1px solid rgba(199,191,230,.16);
  padding:24px 96px 22px 96px;
  display:none;
}
body.tickerOn #tick{display:block;}
body.tickerOn .slide{padding-top:170px;padding-bottom:272px;}
body.tickerOn #editBtn{bottom:calc(26px + 21vh);}
#tickHead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 18px 0;}
#tickLab{font-size:20px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#E84B8A;}
#tickMeta{font-size:18px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8E82BC;}
#tickRow{display:flex;}
.tk{flex:1 1 0;min-width:0;margin-left:64px;padding-left:30px;border-left:1px solid rgba(199,191,230,.15);}
.tk:first-child{margin-left:0;padding-left:0;border-left:0;}
.tkName{font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8E82BC;
  margin:0 0 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tkLine{display:flex;align-items:baseline;}
.tkPx{font-size:44px;font-weight:600;color:#FFFFFF;letter-spacing:-.01em;
  font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;}
.tkCh{font-size:24px;font-weight:700;margin-left:16px;white-space:nowrap;
  font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;}
.tkUp{color:#7FD8AE;}
.tkDn{color:#F5A3A9;}
.tkFl{color:#C7BFE6;}
.tkArw{font-size:19px;margin-right:4px;}
.tkSpark{height:28px;margin-top:8px;}
.tkSpark svg{width:100%;height:100%;display:block;}
</style>

</head>
<body>

function esc(s){
  return String(s == null ? "" : s)

    .replace(/"/g,"&quot;");

  if(s.pixelShift === undefined) s.pixelShift = true;
  if(s.eventMode === undefined) s.eventMode = false;
  if(!s.eventEvery) s.eventEvery = 4;
  if(!s.overscan) s.overscan = 0;
  if(s.liveEvents === undefined) s.liveEvents = false;
  if(!s.eventsFeed) s.eventsFeed = "https://calendar.millsaps.edu/api/2/events?days=60&pp=20";
  if(!s.newsFeed) s.newsFeed = "https://millsaps.edu/wp-json/wp/v2/posts";
  if(s.newsQuery === undefined) s.newsQuery = "";
  if(s.ticker === undefined) s.ticker = true;
}

/* ---------- fit the fixed 1920x1080 stage into any screen ---------- */
var shiftStep = 0;
function fit(){
  var vw = viewport.clientWidth, vh = viewport.clientHeight;
  var inset = 1 - (Number(DATA.settings.overscan) || 0) / 100;
  var k = Math.min(vw / 1920, vh / 1080) * inset;
  /* pixel shift: nudges the whole image a few px on a slow cycle so a
     static logo never burns into a panel left on for months */
  var dx = 0, dy = 0;
  if(DATA.settings.pixelShift){
    var p = [[0,0],[6,4],[0,8],[-6,4]][shiftStep % 4];
    dx = p[0]; dy = p[1];
  }
  var x = (vw - 1920 * k) / 2 + dx;
  var y = (vh - 1080 * k) / 2 + dy;
  stage.style.transform = "translate(" + x + "px," + y + "px) scale(" + k + ")";
}

/* ---------- build the playing loop ---------- */
/* A one-day takeover should not need a second visit to switch off. If
   settings.eventUntil is a YYYY-MM-DD date, event mode is treated as off
   from the following local midnight, and the half-hourly reload rebuilds
   the loop without the welcome card. Nothing else about the file changes. */
/* Card timing. "until" and "from" take "YYYY-MM-DD" or "YYYY-MM-DDTHH:MM"
   (screen's local time, 24-hour clock). A bare date in "until" runs through
   the end of that day; a bare date in "from" starts at midnight. With an
   hour, the card leaves (or arrives) at that minute. */
function whenOf(u, dayEnd){
  var m = /^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?$/.exec(String(u));
  if(!m) return null;
  var y = Number(m[1]), mo = Number(m[2]) - 1, d = Number(m[3]);
  if(m[4] !== undefined) return new Date(y, mo, d, Number(m[4]), Number(m[5]), 0).getTime();
  return dayEnd ? new Date(y, mo, d + 1, 0, 0, 0).getTime() : new Date(y, mo, d, 0, 0, 0).getTime();
}
function notExpired(u){
  if(!u) return true;
  var t = whenOf(u, true);
  return t === null ? true : new Date().getTime() < t;
}
function hasStarted(f){
  if(!f) return true;
  var t = whenOf(f, false);
  return t === null ? true : new Date().getTime() >= t;
}
function isLive(s){ return !s.draft && notExpired(s.until) && hasStarted(s.from); }
function liveSignature(){
  var sig = "", i;
  for(i = 0; i < DATA.slides.length; i++) sig += isLive(DATA.slides[i]) ? "1" : "0";
  return sig;
}
/* "repeat": N plays a card N times per loop, spaced evenly, never first */
function spreadRepeats(list){
  var L = list.length, extras = [], out = list.slice(), i, k, n, p;
  for(i = 0; i < L; i++){
    n = Math.min(6, Math.max(1, Math.floor(Number(list[i].repeat) || 1)));
    for(k = 1; k < n; k++){
      p = i + Math.round(k * L / n);
      if(p > L) p -= L;
      if(p < 1) p = 1;
      extras.push({pos: p, card: list[i]});
    }
  }
  extras.sort(function(a, b){ return b.pos - a.pos; });
  for(i = 0; i < extras.length; i++) out.splice(extras[i].pos, 0, extras[i].card);
  return out;
}
var liveSig = "";
function eventStillOn(){ return notExpired(DATA.settings.eventUntil); }

function buildLoop(){
  var live = [], i;
  for(i = 0; i < DATA.slides.length; i++){
    /* a card may carry "from" and "until" (see whenOf); outside that window it sits out */
    if(isLive(DATA.slides[i])) live.push(DATA.slides[i]);
  }
  liveSig = liveSignature();
  /* "solo": true suspends the normal rotation. While any solo card is live,
     the loop is only the solo cards (in file order, repeats honoured) and
     event mode is skipped. Give solo cards an "until" so the wall returns
     to its regular loop on its own. Added 27 October 2026. */
  var solo = [];
  for(i = 0; i < live.length; i++) if(live[i].solo) solo.push(live[i]);
  if(solo.length) live = solo;
  live = spreadRepeats(live);
  /* event mode: the welcome card leads, then recurs every N slides */
  if(!solo.length && DATA.settings.eventMode && DATA.event && DATA.event.title && eventStillOn()){
    var ev = DATA.event; ev.fmt = "welcome";
    var every = Math.max(2, Number(DATA.settings.eventEvery) || 4);
    var mixed = [clone(ev)];
    for(i = 0; i < live.length; i++){
      mixed.push(live[i]);
      if((i + 1) % every === 0 && i < live.length - 1) mixed.push(clone(ev));
    }
    live = mixed;
  }
  if(!live.length){
    live = [{fmt:"ident", title:"THE ELSE EFFECT", body:"See what Else makes possible."}];
  }
  slides = live;

  var html = "";
  for(i = 0; i < slides.length; i++) html += renderSlide(slides[i]);
  deck.innerHTML = html;
  idx = -1;
}

/* ---------- playback ---------- */
function slideMs(s){
  var base = (Number(DATA.settings.slideSeconds) || 9) * 1000;
  if(s && s.seconds) base = Number(s.seconds) * 1000;
  /* long copy earns a little more time on the wall */
  var chars = String((s && s.title) || "").length + String((s && s.body) || "").length;
  if(chars > 190) base += 2200;
  return base;
}

function fitText(el){
  var inner = el.getElementsByClassName("slideIn")[0];
  if(!inner) return;
  inner.style.transform = "";
  /* Room is the stage height less THIS slide's own padding. It was hardcoded
     at 1080-280 until the ticker band changed the bottom padding; a stale
     number here lets tall copy overflow a centred flex box upward and collide
     with the logo. Read the padding rather than assuming it. */
  var padT = 150, padB = 130;
  if(window.getComputedStyle){
    var cs = getComputedStyle(el);
    padT = parseFloat(cs.paddingTop) || padT;
    padB = parseFloat(cs.paddingBottom) || padB;
  }
  var room = 1080 - padT - padB;
  var h = inner.offsetHeight;
  if(h > room){
    var k = Math.max(0.5, room / h);
    inner.style.transform = "scale(" + k + ")";
  }
}

function show(n){
  var els = deck.children, i;
  if(!els.length) return;
  n = (n + els.length) % els.length;
  for(i = 0; i < els.length; i++) els[i].setAttribute("data-local-on", i === n ? "1" : "0");
  idx = n;
  fitText(els[n]);
  if(idx === 0) shiftStep++, fit();
  runBar(slideMs(slides[n]));
}

function runBar(ms){
  barFill.style.transition = "none";
  barFill.style.width = "0%";
  /* force reflow so the reset takes before the new transition */
  void barFill.offsetWidth;
  barFill.style.transition = "width " + ms + "ms linear";
  barFill.style.width = "100%";
}
function pauseBar(){
  var w = barFill.offsetWidth, total = document.getElementById("bar").offsetWidth;
  barFill.style.transition = "none";
  barFill.style.width = (total ? (w / total) * 100 : 0) + "%";
}

function schedule(ms){
  clearTimeout(timer);
  tStart = new Date().getTime();
  tLeft = ms;
  timer = setTimeout(next, ms);
}
function next(){
  if(idx === slides.length - 1 && !paused && liveSignature() !== liveSig) buildLoop();
  show(idx + 1); if(!paused) schedule(slideMs(slides[idx]));
}
function prev(){ show(idx - 1); if(!paused) schedule(slideMs(slides[idx])); }

function play(){
  paused = false;
  show(idx < 0 ? 0 : idx);
  schedule(slideMs(slides[idx]));
}
function togglePause(){
  if(paused){
    paused = false;
    runBar(tLeft);
    schedule(tLeft);
  } else {
    paused = true;
    clearTimeout(timer);
    tLeft = Math.max(600, tLeft - (new Date().getTime() - tStart));
    pauseBar();
  }
}

/* ---------- clock ---------- */
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function tick(){
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes();
  var ap = h >= 12 ? "PM" : "AM";
  h = h % 12; if(h === 0) h = 12;
  $("clockT").innerHTML = h + ":" + (m < 10 ? "0" : "") + m + " " + ap;
  $("clockD").innerHTML = DAYS[d.getDay()] + ", " + MONS[d.getMonth()] + " " + d.getDate();
}

/* ---------- scheduled reload: picks up newly published content ----------
   The whole point of hosting this at a web address is that the screen
   updates itself when somebody publishes a change from their desk. The
   risk that comes with that is reloading at the exact moment the network
   is down, which on a plain browser means an error page on the wall until
   a human notices. So: probe first, reload only on a confirmed answer,
   and if the network is out just keep playing and try again later. The
   service worker below is the second layer of the same protection. */
function probeThenReload(){
  if(!window.fetch){ location.reload(); return; }
  if(navigator.onLine === false) return;             /* obviously offline */
  fetch(location.href, {method:"GET", cache:"no-store"}).then(function(r){
    if(r && r.ok) location.reload();                 /* confirmed reachable */
  }).then(null, function(){
    /* unreachable: the loop carries on from memory, untouched */
  });
}

function armReload(){
  var mins = Number(DATA.settings.reloadMinutes) || 0;
  if(mins < 5) return;
  setInterval(function(){
    /* wait for the ident card so nobody ever sees a reload mid-story */
    var waited = 0;
    var wait = setInterval(function(){
      waited += 1500;
      if(idx === 0 || waited > 240000){ clearInterval(wait); probeThenReload(); }
    }, 1500);
  }, mins * 60000);
}

/* Offline safety net. Registers only when served over http(s); opening the
   file directly from a disk, or inside a preview frame, skips it silently. */
function armServiceWorker(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol !== "http:" && location.protocol !== "https:") return;
  try{
    navigator.serviceWorker.register("sw.js").then(null, function(){
      /* no sw.js alongside the page, or registration refused: the screen
         works exactly as before, it just loses the offline fallback */
    });
  } catch(e){}
}

      '</select></div>';
    h += '<div class="edRow"><label>Keep it filled</label><input type="checkbox" data-f="live"' + (s.live ? " checked" : "") + '></div>';
    h += '<p style="margin:0 0 12px 0;font-size:11.5px;line-height:1.5;color:#9C8FCB;">Leave this off for a hand-typed list, such as what is on in Murrah. Tick it and the chosen Millsaps source rewrites these rows every hour, so anything typed here is replaced.</p>';
  } else if(s.fmt === "wall"){
    h += '<div class="edField"><label>Headline</label><input type="text" data-f="title" value="' + esc(s.title) + '"></div>';
    h += '<div class="edField"><label>Tagline (optional)</label><input type="text" data-f="body" value="' + esc(s.body) + '"></div>';
    h += '<div class="edField"><label>Names, one per line</label><textarea data-f="items">' + esc((s.items || []).join("\n")) + '</textarea></div>';
  } else {
    h += '<div class="edField"><label>Headline</label><textarea data-f="title">' + esc(s.title) + '</textarea></div>';
    h += '<div class="edField"><label>One sentence</label><textarea data-f="body">' + esc(s.body) + '</textarea></div>';
  }
  h += '<div class="edField"><label>Footer line</label><input type="text" data-f="meta" value="' + esc(s.meta) + '"></div>';
  h += '<div class="edRow"><label>Hold as draft</label><input type="checkbox" data-f="draft"' + (s.draft ? " checked" : "") + '></div>';
  h += '<div class="slActions">' +
    '<button class="btn sm gh" data-act="up">&uarr;</button>' +
    '<button class="btn sm gh" data-act="down">&darr;</button>' +
    '<button class="btn sm gh" data-act="dupe">Duplicate</button>' +
    '<button class="btn sm gh" data-act="del">Delete</button>' +
    '<button class="btn sm" data-act="preview">Preview</button></div>';
  return h + '</div>';
}

function markDirty(){
  dirty = true;
  buildLoop();
  show(0);
  if(!paused) schedule(slideMs(slides[0]));
  $("jsonOut").value = JSON.stringify(DATA, null, 1);
}

/* editor events */
editor.addEventListener("click", function(e){
  var t = e.target;
  var act = t.getAttribute && t.getAttribute("data-act");
  if(act){
    e.stopPropagation();
    if(act === "add"){
      DATA.slides.push({fmt:"wins", eyebrow:"ELSE WINS", title:"New story headline", body:"One sentence of explanation.", meta:"", draft:true});
      selected = DATA.slides.length - 1; markDirty(); drawEditor(); return;
    }
    if(act === "close"){ toggleEditor(); return; }
    if(act === "copy"){ doCopy(); return; }
    if(act === "save"){ doSave(); return; }
    if(selected < 0) return;
    if(act === "up" && selected > 0){
      var a = DATA.slides.splice(selected,1)[0]; DATA.slides.splice(selected-1,0,a); selected--;
    } else if(act === "down" && selected < DATA.slides.length-1){
      var b2 = DATA.slides.splice(selected,1)[0]; DATA.slides.splice(selected+1,0,b2); selected++;
    } else if(act === "dupe"){
      DATA.slides.splice(selected+1, 0, clone(DATA.slides[selected])); selected++;
    } else if(act === "del"){
      DATA.slides.splice(selected,1); selected = -1;
    } else if(act === "preview"){
      var live = 0, j;
      for(j = 0; j < DATA.slides.length; j++){
        if(j === selected) break;
        if(!DATA.slides[j].draft) live++;
      }
      if(!DATA.slides[selected].draft){ show(live); if(!paused) schedule(slideMs(slides[live])); }
      return;
    }
    markDirty(); drawEditor(); return;
  }
  var row = t;
  while(row && row !== editor && !(row.className && String(row.className).indexOf("sl") === 0)) row = row.parentNode;
  if(row && row.getAttribute && row.getAttribute("data-i") !== null){
    if(t.getAttribute && (t.getAttribute("data-f") !== null)) return;
    var i = Number(row.getAttribute("data-i"));
    selected = (selected === i) ? -1 : i;
    drawEditor();
  }
});

editor.addEventListener("change", function(e){ applyField(e.target); });
editor.addEventListener("input", function(e){
  var t = e.target;
  if(t.tagName === "TEXTAREA" || t.type === "text") applyField(t, true);
});

function applyField(t, quiet){
  if(!t || !t.getAttribute) return;
  var f = t.getAttribute("data-f"), st = t.getAttribute("data-set"), ev = t.getAttribute("data-ev");
  var v = (t.type === "checkbox") ? t.checked : t.value;
  if(f !== null && selected >= 0){
    var s = DATA.slides[selected];
    if(f === "items") s.items = String(v).split("\n");
    else s[f] = v;
    if(f === "fmt" || f === "draft" || f === "live" || f === "source"){ markDirty(); drawEditor(); refreshFeeds(); return; }
    markDirty();
    if(!quiet) drawEditorTitles();
    return;
  }
  if(st !== null){
    if(st === "eventMode" || st === "pixelShift" || st === "liveEvents" || st === "ticker") DATA.settings[st] = v;
    else DATA.settings[st] = Number(v);
    markDirty(); fit();
    if(st === "eventMode"){ drawEditor(); }
    return;
  }
  if(ev !== null){
    if(!DATA.event) DATA.event = {};
    DATA.event[ev] = v;
    markDirty();
  }
}
function drawEditorTitles(){
  var rows = editor.getElementsByClassName("sl"), i, n;
  for(i = 0; i < rows.length; i++){
    n = Number(rows[i].getAttribute("data-i"));
    var t = rows[i].getElementsByClassName("ttl")[0];
    if(t) t.innerHTML = esc((DATA.slides[n].title || "(untitled)").substring(0,96));
  }
}

function msg(txt, kind){
  var m = $("edMsg"); if(!m) return;
  m.innerHTML = txt; m.className = kind || "";
}

function doCopy(){
  var ta = $("jsonOut");
  ta.select();
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value);
    } else { document.execCommand("copy"); }
    msg("Content copied. Paste it between the else-data script tags.", "ok");
  } catch(e){ msg("Select the text above and copy it manually.", "err"); }
}

/* Save: republish this artifact with the new content baked in.
   Works on the claude.ai copy; on a self-hosted copy it explains
   the copy-and-paste route instead. */
function doSave(){
  msg("Saving...");
  if(!(window.claude && window.claude.use)){
    msg("This copy is self-hosted, so there is nothing to publish to. Use Copy content and paste it into the file.", "err");
    return;
  }
  window.claude.use("artifact").then(function(api){
    if(!api){ msg("This view is read-only. Use Copy content instead.", "err"); return; }
    return fetch(location.href, {cache:"no-store"}).then(function(r){ return r.text(); }).then(function(src){
      var open = src.indexOf('id="else-data"');
      if(open < 0 || src.indexOf("<!doctype") !== 0 && src.indexOf("<!DOCTYPE") !== 0){
        msg("Could not rewrite the page source. Use Copy content instead.", "err"); return;
      }
      var gt = src.indexOf(">", open) + 1;
      var end = src.indexOf("<\/script>", gt);
      var next2 = src.slice(0, gt) + JSON.stringify(DATA) + src.slice(end);
      return api.publish(next2).then(function(){ msg("Published. Every screen picks it up on its next reload.", "ok"); });
    });
  }).then(null, function(err){
    var code = (err && err.code) || "";
    if(code === "conflict") msg("Someone else saved first. This page is reloading to their version.", "err");
    else if(code === "not_writer" || code === "not_granted") msg("This view is read-only. Use Copy content instead.", "err");
    else msg("Could not publish (" + (code || "error") + "). Use Copy content instead.", "err");
  });
}

/* ---------- the edit button ---------- */
var btn = $("editBtn"), btnTimer = null;
function flashBtn(ms){
  btn.className = "show";
  clearTimeout(btnTimer);
  btnTimer = setTimeout(function(){ if(!editorOpen()) btn.className = ""; }, ms || 3000);
}
btn.addEventListener("click", function(e){ e.preventDefault(); toggleEditor(); });
document.addEventListener("mousemove", function(){ if(!editorOpen()) flashBtn(3000); });
document.addEventListener("touchstart", function(){ if(!editorOpen()) flashBtn(6000); });

/* A TV remote's centre button arrives as a click on the page. Use it to go
   full screen, which is the only way to lose a browser's address bar on a
   device with no keyboard. */
function goFull(){
  var el = document.documentElement;
  if(document.fullscreenElement || document.webkitFullscreenElement) return;
  if(el.requestFullscreen) el.requestFullscreen();
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
viewport.addEventListener("click", function(e){
  if(editorOpen()) return;
  if(e.target && e.target.id === "editBtn") return;
  goFull();
});

/* ---------- keys ---------- */
document.addEventListener("keydown", function(e){
  var tag = (e.target && e.target.tagName) || "";
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT"){
    if(e.key === "Escape") e.target.blur();
    return;
  }
  var k = e.key;
  if(k === "e" || k === "E"){ toggleEditor(); e.preventDefault(); }
  else if(k === "ArrowRight"){ next(); }
  else if(k === "ArrowLeft"){ prev(); }
  else if(k === " "){ togglePause(); e.preventDefault(); }
  else if(k === "r" || k === "R"){ show(0); if(!paused) schedule(slideMs(slides[0])); }
  else if(k === "Enter"){ goFull(); }
  else if(k === "f" || k === "F"){
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
});

/* ============================================================
   LIVE CALENDAR (optional)
   Pulls the college calendar straight into the "Happening at
   Millsaps" card so nobody has to retype fixtures. It runs at most
   once an hour, it never blocks playback, and if the feed is
   unreachable or blocked the card simply keeps showing whatever was
   last written into it. Off by default: turn it on in the editor
   once you have confirmed it works from wherever you host the file.
   ============================================================ */
function trim(x){ return String(x == null ? "" : x).replace(/^\s+|\s+$/g, ""); }
var MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

function stampDate(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return MON[d.getMonth()] + " " + d.getDate();
}
function stampTime(iso, allDay){
  if(allDay) return "";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? "p.m." : "a.m.";
  h = h % 12; if(h === 0) h = 12;
  return h + (m ? ":" + (m < 10 ? "0" : "") + m : "") + " " + ap;
}
/* Strip the HTML and entities WordPress wraps its titles in. */
function plain(h){
  var t = String(h == null ? "" : h).replace(/<[^>]*>/g, "");
  t = t.replace(/&#8217;|&#039;|&#39;/g, "'")
       .replace(/&#8220;|&#8221;|&quot;/g, '"')
       .replace(/&#8211;|&#8212;/g, ",")
       .replace(/&amp;/g, "&").replace(/&nbsp;/g, " ");
  return trim(t.replace(/\s+/g, " "));
}

/* Build the request for whichever feed a card is pointed at. */
function feedUrl(card){
  if(card.source === "news"){
    var q = DATA.settings.newsQuery ? "&search=" + encodeURIComponent(DATA.settings.newsQuery) : "";
    return DATA.settings.newsFeed + "?per_page=8&_fields=date,title" + q;
  }
  return DATA.settings.eventsFeed;
}

/* Turn a feed response into the card's own "WHEN | WHAT | WHERE" rows. */
function rowsFromCalendar(j){
  var rows = [], k, ev, inst, when, place, tm;
  if(!j || !j.events) return rows;
  for(k = 0; k < j.events.length && rows.length < 5; k++){
    ev = j.events[k] && j.events[k].event;
    if(!ev) continue;
    inst = ev.event_instances && ev.event_instances[0] && ev.event_instances[0].event_instance;
    if(!inst) continue;
    when = stampDate(inst.start);
    if(!when) continue;
    tm = stampTime(inst.start, inst.all_day);
    place = trim(ev.location_name || ev.room_number || "");
    if(place && /^[0-9]+[A-Za-z]?$/.test(place)) place = "Room " + place;
    if(tm) place = place ? place + ", " + tm : tm;
    rows.push(when + "|" + trim(ev.title) + "|" + place);
  }
  return rows;
}
function rowsFromNews(j){
  var rows = [], k, p, t, age, fresh = [], all = [];
  if(!j || !j.length) return rows;
  var now = new Date().getTime(), DAY = 86400000;

  for(k = 0; k < j.length; k++){
    p = j[k];
    t = plain(p.title && p.title.rendered);
    if(!t) continue;

    /* Skip video and photo posts outright rather than tidying their titles.
       A wall cannot play a video, and stripping the prefix leaves a headline
       that is not a sentence: "Summer Interns 2026 Christian Gray" tells a
       passer-by nothing. Better to show one fewer story than a dead end. */
    if(/^(VIDEO|PHOTOS?|WATCH|LISTEN|GALLERY|SLIDESHOW)\s*[:\-]/i.test(t)) continue;

    /* Skip the evergreen programme pages the search turns up. */
    if(/^(Graduate Certificates|National Scholarships and Fellowships)$/i.test(t)) continue;

    t = trim(t.replace(/\s*[,:;\-]\s*$/, ""));
    if(!t) continue;

    var row = stampDate(p.date) + "|" + t + "|";
    all.push(row);
    age = (now - new Date(p.date).getTime()) / DAY;
    if(age <= 180) fresh.push(row);
  }

  /* Prefer stories from the last six months. If the college has been quiet,
     fall back to whatever exists rather than showing an empty card. */
  rows = (fresh.length >= 2) ? fresh : all;
  return rows.slice(0, 4);
}

/* ============================================================
   SELF-FEEDING CARDS
   Any agenda card marked live pulls its own rows straight from a
   Millsaps source, once an hour, from the screen itself. No server
   in between and nobody pressing anything. If a feed is unreachable
   the card simply keeps whatever it last showed.
   ============================================================ */
function refreshFeeds(){
  if(!DATA.settings.liveEvents || !window.fetch) return;
  var i;
  for(i = 0; i < DATA.slides.length; i++){
    (function(card){
      if(!card || card.fmt !== "agenda" || !card.live || card.draft) return;
      fetch(feedUrl(card), {cache:"no-store"}).then(function(r){
        return r.ok ? r.json() : null;
      }).then(function(j){
        if(!j) return;
        var rows = (card.source === "news") ? rowsFromNews(j) : rowsFromCalendar(j);
        if(!rows.length) return;
        if(rows.join("~") === (card.items || []).join("~")) return;   /* nothing new */
        card.items = rows;
        var wasAt = idx;
        buildLoop();
        show(wasAt);
      }).then(null, function(){ /* unreachable: leave the card alone */ });
    })(DATA.slides[i]);
  }
}

/* ---------- market band ----------
   Data comes from quotes.json beside this file, refreshed by a GitHub
   Action on a weekday-daytime cron. Nothing here holds an API key and
   nothing here talks to a data vendor: if the file is missing or stale
   the band simply hides itself rather than putting an error on a wall. */
var TICK = { groups: [], i: 0, updated: "", open: false };

function tkComma(v){
  var n = (v === null || v === undefined) ? "" : String(v);
  var neg = n.charAt(0) === "-";
  if(neg) n = n.substring(1);
  var parts = n.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + parts.join(".");
}

function tkSpark(vals){
  if(!vals || vals.length < 3) return "";
  var w = 100, h = 30, i, min = vals[0], max = vals[0];
  for(i = 0; i < vals.length; i++){
    if(vals[i] < min) min = vals[i];
    if(vals[i] > max) max = vals[i];
  }
  var span = (max - min) || 1, pts = [];
  for(i = 0; i < vals.length; i++){
    var x = (i / (vals.length - 1)) * (w - 3);
    var y = h - ((vals[i] - min) / span) * (h - 4) - 2;
    pts.push(x.toFixed(1) + "," + y.toFixed(1));
  }
  var last = pts[pts.length - 1].split(",");
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<polyline points="' + pts.join(" ") + '" fill="none" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity=".85"></polyline>' +
    '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2" fill="currentColor"></circle></svg>';
}

function tkStamp(){
  var t = TICK.updated ? Date.parse(TICK.updated) : 0;
  var now = new Date();
  if(!t || !TICK.open || (now.getTime() - t) > 45 * 60 * 1000){
    /* Closed-market state. If the data is from an earlier calendar day,
       carry the date so a wall that has stopped refreshing (network gone,
       serving the service worker's cached copy) announces it instead of
       looking like last night's close. */
    if(t){
      var d = new Date(t);
      if(d.getFullYear() !== now.getFullYear() || d.getMonth() !== now.getMonth() || d.getDate() !== now.getDate()){
        return "At close · " + DAYS[d.getDay()].substring(0, 3) + " " + MONS[d.getMonth()].substring(0, 3) + " " + d.getDate();
      }
    }
    return "At close · Delayed";
  }
  var d = new Date(t), hh = d.getHours(), mm = d.getMinutes();
  var ap = hh >= 12 ? "PM" : "AM";
  hh = hh % 12; if(!hh) hh = 12;
  return "Delayed 15 min · " + hh + ":" + (mm < 10 ? "0" : "") + mm + " " + ap;
}

function tkShow(on){
  var b = document.body, c = " " + b.className + " ";
  if(on && c.indexOf(" tickerOn ") < 0) b.className = (b.className + " tickerOn").replace(/^\s+/, "");
  if(!on) b.className = c.replace(" tickerOn ", " ").replace(/^\s+|\s+$/g, "");
}

function tkPaint(){
  var g = TICK.groups[TICK.i];
  if(!g || !g.rows || !g.rows.length) return;
  var rows = g.rows.slice(0, 4), h = "", i, r, cls, arw, pct;
  for(i = 0; i < rows.length; i++){
    r = rows[i];
    cls = r.dir > 0 ? "tkUp" : (r.dir < 0 ? "tkDn" : "tkFl");
    arw = r.dir > 0 ? "▲" : (r.dir < 0 ? "▼" : "–");
    pct = (r.percent === null || r.percent === undefined) ? "" : String(r.percent);
    if(r.dir > 0 && pct.charAt(0) !== "+") pct = "+" + pct;
    h += '<div class="tk">' +
         '<p class="tkName">' + esc(r.name || r.symbol) + '</p>' +
         '<div class="tkLine"><span class="tkPx">' + esc(tkComma(r.price)) + '</span>' +
         '<span class="tkCh ' + cls + '"><span class="tkArw">' + arw + '</span>' + esc(pct) + '%</span></div>' +
         '<div class="tkSpark ' + cls + '">' + tkSpark(r.spark) + '</div>' +
         '</div>';
  }
  document.getElementById("tickRow").innerHTML = h;
  document.getElementById("tickLab").textContent = g.label + (g.proxy ? " · ETFs" : "");
  document.getElementById("tickMeta").textContent = tkStamp();
}

function tkLoad(){
  if(!DATA.settings.ticker){ tkShow(false); return; }
  fetch("quotes.json", {cache:"no-store"}).then(function(r){
    return r.ok ? r.json() : null;
  }).then(function(j){
    if(!j || !j.groups || !j.groups.length){ tkShow(false); return; }
    /* A week-old file means the refresh chain or the wall's network has
       been dead for days. Hide the band rather than show ancient prices. */
    if(j.updated && (new Date().getTime() - Date.parse(j.updated)) > 7 * 24 * 60 * 60 * 1000){ tkShow(false); return; }
    TICK.groups = j.groups;
    TICK.updated = j.updated || "";
    TICK.open = !!j.marketOpen;
    if(TICK.i >= TICK.groups.length) TICK.i = 0;
    tkShow(true);
    tkPaint();
    fit();
  })["catch"](function(){ tkShow(false); });
}

function tkCycle(){
  if(!DATA.settings.ticker || TICK.groups.length < 2) return;
  TICK.i = (TICK.i + 1) % TICK.groups.length;
  tkPaint();
}

/* ---------- go ---------- */
loadData();
buildLoop();
fit();
tick();
setInterval(tick, 10000);
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);
if(location.hash.indexOf("edit") >= 0) setTimeout(toggleEditor, 300);
armReload();
armServiceWorker();
refreshFeeds();
setInterval(refreshFeeds, 3600000);
tkLoad();
setInterval(tkLoad, 600000);
setInterval(tkCycle, 15000);
/* let the webfonts land before the first card so nothing reflows on screen */
setTimeout(play, 260);
setTimeout(function(){ flashBtn(6000); }, 1400);

})();
</script>
